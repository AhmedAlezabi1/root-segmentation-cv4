# alembic.ini
# ===========
# Alembic configuration file for cv4 database migrations.
#
# Usage:
#   uv run alembic upgrade head      # apply all migrations
#   uv run alembic downgrade -1      # roll back one migration
#   uv run alembic revision --autogenerate -m "describe change"  # generate new migration
#   uv run alembic current           # show current migration state
#   uv run alembic history           # show migration history

[alembic]
# Path to the alembic migrations directory, relative to this file
script_location = alembic

# Database URL. Overridden at runtime by env.py which reads DATABASE_URL
# from the environment. This value is a fallback for alembic CLI usage
# without the application context.
sqlalchemy.url = sqlite:///./feedback.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
